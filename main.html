<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }

      .hero {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 100vh;
      }
      .item1 {
        width: 75%;
        height: 100%;
      }
      img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .item2 {
        width: 25%;
        text-align: center;
      }
      h1,
      p {
        margin-bottom: 15px;
      }
      a {
        padding: 8px 18px;
        background-color: red;
        color: white;
        border-radius: 3px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <div class="item1">
        <img
          src="https://images.pexels.com/photos/2662116/pexels-photo-2662116.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1"
          alt="HeroImage"
        />
      </div>
      <div class="item2">
        <h1>Welcome to my <br />Pinterest clone</h1>
        <p>Discover new inspiration and save your<br />favorite ideas</p>
        <a href="#" class="explore">Explore now</a>
      </div>
    </div>
  </body>
</html>
